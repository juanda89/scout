<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Orb states</title>
<script src="5e513da5-7f5b-4b3a-9b6c-019b5c3fd3b7"></script>
<script src="89a372c8-d903-4cb8-973f-5b9954d15be6"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style></style>
<style>
body{margin:0;background:#F6F6F7;-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 960px; height: 560px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 22px; background: #F6F6F7; color: #0B0B0C; font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em">Orb states</h1>
      <p style="margin: 0; font-size: 13.5px; color: #4B4B52">One state per moment in the product. Engine: thinking-orbs by libraries.dev (MIT).</p>
    </div>
    <span style="font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6B73">7 states</span>
  </div>
  <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{states}}" as="s" hint-placeholder-count="7">
      <div style="padding: 14px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #E6E6E9; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,16,24,0.04)">
        <div style="flex: 1; border-radius: 10px; background: #F6F6F7; display: flex; align-items: center; justify-content: center">
          <dc-import name="Orb" mode="{{s.mode}}" px="64" hint-size="64px,64px"></dc-import>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; color: #6B6B73">{{s.mode}}</span>
          <span style="font-size: 13.5px; font-weight: 600">{{s.t}}</span>
          <span style="font-size: 12px; line-height: 1.4; color: #6B6B73">{{s.where}}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:560}}">
class Component extends DCLogic {
  renderVals() {
    var S = [
      ['breathing', 'Idle', 'Sign in · estimated-time hint'],
      ['listening', 'Interpreting the brief', 'Describe step · stage 01'],
      ['shaping', 'Shaping the brief', 'Describe → Confirm transition'],
      ['searching', 'Finding candidates', 'Stage 02'],
      ['working', 'Analyzing content', 'Stage 03 · “running” indicator'],
      ['connecting', 'Evaluating audiences', 'Stage 04'],
      ['solving', 'Scoring fit', 'Stage 05']
    ];
    return { states: S.map(function (s) { return { mode: s[0], t: s[1], where: s[2] }; }) };
  }
}
</script>


</body></html>
