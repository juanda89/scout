<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>HUD rings</title>
<script src="dbbc3091-db37-4239-a674-3f2f897ff8fa"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="position: relative; flex: none; width: {{px}}px; height: {{px}}px; pointer-events: none">
  <canvas ref="{{setRef}}" id="{{uid}}" width="{{pw}}" height="{{pw}}" style="position: absolute; left: 0; top: 0; width: {{px}}px; height: {{px}}px; display: block"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;px&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:320,&quot;min&quot;:80,&quot;max&quot;:720,&quot;unit&quot;:&quot;px&quot;},&quot;intensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:2,&quot;step&quot;:0.05},&quot;speed&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;min&quot;:0.2,&quot;max&quot;:3,&quot;step&quot;:0.1},&quot;labels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320}}">
class Component extends DCLogic {
  px() { var v = parseFloat(this.props.px); return v > 0 ? Math.round(v) : 320; }
  num(v, d) { var n = parseFloat(v); return isNaN(n) ? d : n; }

  componentDidMount() {
    var self = this;
    this._alive = true;
    this._t = Math.random() * 8;
    this._age = 0;
    this._last = null;
    try { this._reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { this._reduce = false; }
    var loop = function (now) {
      if (!self._alive) return;
      var c = self._c;
      if (!c || !c.isConnected) { c = document.getElementById(self._uid); if (c) self._c = c; }
      if (c) {
        if (self._last == null) self._last = now;
        var dt = Math.min(0.1, Math.max(0, (now - self._last) / 1000));
        self._last = now;
        if (self._reduce) {
          if (self._drawnW !== c.width) { self._drawnW = c.width; self.draw(c, 2, 1); }
        } else {
          self._t += dt * self.num(self.props.speed, 1);
          self._age += dt;
          var k = Math.min(1, self._age / 1.4);
          self.draw(c, self._t, 1 - Math.pow(1 - k, 3));
        }
      }
      self._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  draw(c, t, intro) {
    var ctx = c.getContext('2d');
    if (!ctx) return;
    var px = this.px(), dpr = c.width / px, TAU = Math.PI * 2;
    var I = Math.max(0, this.num(this.props.intensity, 1)) * intro;
    var R = px / 2 * (0.86 + 0.14 * intro);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, px, px);
    ctx.translate(px / 2, px / 2);
    function ink(a) { return 'rgba(11,11,12,' + Math.max(0, Math.min(1, a * I)).toFixed(3) + ')'; }

    ctx.lineWidth = 1;
    ctx.strokeStyle = ink(0.07);
    ctx.beginPath(); ctx.arc(0, 0, R * 0.70, 0, TAU); ctx.stroke();

    var rA = R * 0.94, rotA = t * 0.05, i, a;
    ctx.strokeStyle = ink(0.10);
    ctx.beginPath(); ctx.arc(0, 0, rA, 0, TAU); ctx.stroke();
    var minor = new Path2D(), major = new Path2D();
    for (i = 0; i < 120; i++) {
      a = rotA + i * TAU / 120;
      var big = i % 10 === 0, len = big ? Math.max(5, px * 0.026) : Math.max(2.5, px * 0.011);
      var p = big ? major : minor, cs = Math.cos(a), sn = Math.sin(a);
      p.moveTo(cs * rA, sn * rA);
      p.lineTo(cs * (rA - len), sn * (rA - len));
    }
    ctx.strokeStyle = ink(0.11); ctx.stroke(minor);
    ctx.strokeStyle = ink(0.24); ctx.stroke(major);

    var rB = R * 0.83, rotB = -t * 0.12;
    ctx.lineWidth = 1.25;
    ctx.strokeStyle = ink(0.16);
    for (i = 0; i < 4; i++) {
      var b0 = rotB + i * TAU / 4;
      ctx.beginPath(); ctx.arc(0, 0, rB, b0, b0 + 0.95); ctx.stroke();
    }
    ctx.fillStyle = ink(0.32);
    for (i = 0; i < 4; i++) {
      var e = rotB + i * TAU / 4 + 0.95;
      ctx.beginPath(); ctx.arc(Math.cos(e) * rB, Math.sin(e) * rB, 1.6, 0, TAU); ctx.fill();
    }

    var sw = t * 0.7;
    ctx.lineWidth = 1.6;
    for (i = 0; i < 16; i++) {
      ctx.strokeStyle = ink(0.42 * (1 - i / 16));
      ctx.beginPath(); ctx.arc(0, 0, rA, sw - (i + 1) * 0.045, sw - i * 0.045); ctx.stroke();
    }
    ctx.fillStyle = ink(0.75);
    ctx.beginPath(); ctx.arc(Math.cos(sw) * rA, Math.sin(sw) * rA, 2.2, 0, TAU); ctx.fill();

    ctx.lineWidth = 1;
    ctx.strokeStyle = ink(0.26);
    for (i = 0; i < 4; i++) {
      a = i * TAU / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * R * 0.975, Math.sin(a) * R * 0.975);
      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.stroke();
    }

    if (this.props.labels !== false && this.props.labels !== 'false' && px >= 200) {
      ctx.fillStyle = ink(0.38);
      ctx.font = '500 ' + Math.max(8, Math.round(px * 0.026)) + 'px "Geist Mono", ui-monospace, Menlo, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var L = ['000', '090', '180', '270'], rl = R * 0.765;
      for (i = 0; i < 4; i++) {
        a = -Math.PI / 2 + i * TAU / 4;
        ctx.fillText(L[i], Math.cos(a) * rl, Math.sin(a) * rl);
      }
    }
  }

  renderVals() {
    var self = this;
    if (!this._uid) this._uid = 'hud-' + Math.random().toString(36).slice(2, 10);
    if (!this._setRef) this._setRef = function (el) { if (el) self._c = el; };
    var px = this.px(), dpr = 1;
    try { dpr = Math.min(2, window.devicePixelRatio || 1); } catch (e) {}
    return { uid: this._uid, setRef: this._setRef, px: px, pw: Math.round(px * dpr) };
  }
}
</script>


</body></html>
