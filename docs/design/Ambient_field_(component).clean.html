<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Ambient field</title>
<script src="f3cd595a-a621-4424-8dae-4f01f0637be5"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; background: #F4F4F6">
  <canvas ref="{{setRef}}" id="{{uid}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;fx&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.5,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Focus&quot;},&quot;fy&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;section&quot;:&quot;Focus&quot;},&quot;intensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.05},&quot;spacing&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:22,&quot;min&quot;:12,&quot;max&quot;:48,&quot;unit&quot;:&quot;px&quot;},&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320}}">
class Component extends DCLogic {
  num(v, d) { var n = parseFloat(v); return isNaN(n) ? d : n; }

  componentDidMount() {
    var self = this;
    this._alive = true;
    this._t = Math.random() * 20;
    this._last = null;
    this._lastDraw = 0;
    this._mx = -9999; this._my = -9999; this._seen = -1e9; this._glow = 0;
    try { this._reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { this._reduce = false; }
    this._onMove = function (e) {
      var c = self._c;
      if (!c) return;
      var r = c.getBoundingClientRect();
      if (!r.width) return;
      var k = c.clientWidth / r.width;
      self._mx = (e.clientX - r.left) * k;
      self._my = (e.clientY - r.top) * k;
      self._seen = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    };
    try { window.addEventListener('pointermove', this._onMove, { passive: true }); } catch (e) {}
    var loop = function (now) {
      if (!self._alive) return;
      var c = self._c;
      if (!c || !c.isConnected) { c = document.getElementById(self._uid); if (c) self._c = c; }
      if (c) {
        if (self._last == null) self._last = now;
        var dt = Math.min(0.1, Math.max(0, (now - self._last) / 1000));
        self._last = now;
        self._t += dt;
        var target = (now - self._seen) < 2500 ? 1 : 0;
        self._glow += (target - self._glow) * Math.min(1, dt * 3);
        if (self._reduce) {
          if (!self._static || c.width !== self._w) { self._static = true; self.draw(c, 3.2); }
        } else if (now - self._lastDraw > 32) {
          self._lastDraw = now;
          self.draw(c, self._t);
        }
      }
      self._raf = requestAnimationFrame(loop);
    };
    this._raf = requestAnimationFrame(loop);
  }

  componentWillUnmount() {
    this._alive = false;
    if (this._raf) cancelAnimationFrame(this._raf);
    try { window.removeEventListener('pointermove', this._onMove); } catch (e) {}
  }

  draw(c, t) {
    var w = c.clientWidth, h = c.clientHeight;
    if (!w || !h) return;
    var dpr = 1;
    try { dpr = Math.min(1.5, window.devicePixelRatio || 1); } catch (e) {}
    var W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    this._w = W;
    var ctx = c.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var fx = w * this.num(this.props.fx, 0.5), fy = h * this.num(this.props.fy, 0.3);
    var I = Math.max(0, this.num(this.props.intensity, 1));
    var S = Math.max(12, Math.round(this.num(this.props.spacing, 22)));
    var far = Math.sqrt(Math.max(fx, w - fx) * Math.max(fx, w - fx) + Math.max(fy, h - fy) * Math.max(fy, h - fy));

    var g = ctx.createRadialGradient(fx, fy, 0, fx, fy, far);
    g.addColorStop(0, '#FDFDFE');
    g.addColorStop(0.45, '#F6F6F8');
    g.addColorStop(1, '#ECECF0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    var B = 12, paths = [], i;
    for (i = 0; i < B; i++) paths.push(new Path2D());
    var TAU = Math.PI * 2, glow = this._glow, mx = this._mx, my = this._my;
    var row = 0;
    for (var y = S * 0.5; y < h + S; y += S * 0.866, row++) {
      var off = (row % 2) ? S * 0.5 : 0;
      for (var x = off; x < w + S; x += S) {
        var dx = x - fx, dy = y - fy, d = Math.sqrt(dx * dx + dy * dy);
        var wave = Math.cos(TAU * (d / 460 - t / 7.5));
        var ring = wave > 0 ? Math.pow(wave, 22) : 0;
        var fall = Math.exp(-d / 1150);
        var ex = x - mx, ey = y - my;
        var spot = glow * Math.exp(-(ex * ex + ey * ey) / 39200);
        var sh = 0.5 + 0.5 * Math.sin(x * 0.012 + t * 0.55) * Math.sin(y * 0.010 - t * 0.38);
        var near = Math.exp(-d / 700);
        var a = (0.045 + 0.035 * sh + 0.05 * near + 0.17 * ring * fall + 0.24 * spot) * I;
        if (a < 0.012) continue;
        var r = 0.7 + 0.85 * Math.min(1, ring * fall * 1.4 + spot);
        var k = Math.min(B - 1, Math.floor(a / 0.42 * B));
        paths[k].moveTo(x + r, y);
        paths[k].arc(x, y, r, 0, TAU);
      }
    }
    for (i = 0; i < B; i++) {
      ctx.fillStyle = 'rgba(11,11,12,' + ((i + 0.5) / B * 0.42).toFixed(3) + ')';
      ctx.fill(paths[i]);
    }

    ctx.lineWidth = 1;
    var rings = [[340, 0.05, 0.035, 10], [520, 0.035, -0.022, 14]];
    for (var q = 0; q < rings.length; q++) {
      var R = rings[q][0], al = rings[q][1] * I, sp = rings[q][2], segs = rings[q][3];
      ctx.strokeStyle = 'rgba(11,11,12,' + al.toFixed(3) + ')';
      var base = t * sp;
      for (var s = 0; s < segs; s++) {
        var a0 = base + s * TAU / segs;
        ctx.beginPath();
        ctx.arc(fx, fy, R, a0, a0 + TAU / segs * 0.62);
        ctx.stroke();
      }
    }
  }

  renderVals() {
    var self = this;
    if (!this._uid) this._uid = 'field-' + Math.random().toString(36).slice(2, 10);
    if (!this._setRef) this._setRef = function (el) { if (el) self._c = el; };
    return { uid: this._uid, setRef: this._setRef };
  }
}
</script>


</body></html>
