# Despliegue ligero (una instancia): Postgres + web + worker. Variables en .env.prod (no se versiona).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env.prod}
      POSTGRES_DB: scoutting
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scoutting"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://scout:${POSTGRES_PASSWORD}@db:5432/scoutting
    ports: ["80:3000"]
    depends_on:
      db: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://scout:${POSTGRES_PASSWORD}@db:5432/scoutting
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
