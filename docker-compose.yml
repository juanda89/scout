services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scoutting-db
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scoutting
    ports:
      - "5433:5432"
    volumes:
      - scoutting-pgdata:/var/lib/postgresql/data
volumes:
  scoutting-pgdata:
